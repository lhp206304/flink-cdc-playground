# log4j 1.x 配置（兼容 reload4j）
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5p %c{1} - %m%n

log4j.rootLogger=info, console

# 降低框架日志级别，减少噪音
log4j.logger.org.apache.kafka=warn
log4j.logger.org.apache.flink.runtime.webmonitor=warn
log4j.logger.org.apache.flink.api.java.typeutils=warn
log4j.logger.org.apache.flink.table=warn
log4j.logger.org.apache.iceberg=warn
log4j.logger.org.apache.hadoop=warn
